<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 95" width="420" height="95">
  <defs>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2B755"/>
      <stop offset="40%" stop-color="#C59B27"/>
      <stop offset="80%" stop-color="#9A7010"/>
      <stop offset="100%" stop-color="#D8A939"/>
    </linearGradient>
    <linearGradient id="goldSheenLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F3DC9B"/>
      <stop offset="100%" stop-color="#C59B27"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Luxury Monogram Emblem Box -->
  <g transform="translate(8, 8)" filter="url(#subtleShadow)">
    <!-- Outer Octagon / Rounded Shield -->
    <rect x="0" y="0" width="78" height="78" rx="14" fill="#141416" stroke="url(#goldSheen)" stroke-width="2.5"/>
    
    <!-- Inner Accent Border -->
    <rect x="5" y="5" width="68" height="68" rx="10" fill="none" stroke="url(#goldSheenLight)" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="3, 3"/>
    
    <!-- Camera Aperture Blades Graphic -->
    <circle cx="39" cy="36" r="21" fill="none" stroke="url(#goldSheen)" stroke-width="1.8"/>
    <circle cx="39" cy="36" r="13" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.8"/>
    <circle cx="39" cy="36" r="5.5" fill="url(#goldSheen)"/>
    
    <!-- Studio Tag -->
    <text x="39" y="66" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="7" font-weight="800" fill="url(#goldSheen)" text-anchor="middle" letter-spacing="1.8">EST. KATNI</text>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(102, 14)">
    <!-- Main Studio Name -->
    <text x="0" y="32" font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif" font-size="28" font-weight="700" fill="#171717" letter-spacing="3.5">
      THE KATNI CREATION
    </text>
    
    <!-- Gold Divider Line -->
    <line x1="0" y1="42" x2="295" y2="42" stroke="url(#goldSheen)" stroke-width="1.2" stroke-opacity="0.7"/>
    
    <!-- Subtitle / Tagline -->
    <text x="1" y="56" font-family="'Plus Jakarta Sans', -apple-system, Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#78716C" letter-spacing="2.8">
      CINEMATIC WEDDINGS &bull; FINE ART MONOGRAPHS
    </text>
  </g>
</svg>
