<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="380" height="90">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3EFEA" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#E5C158" />
    </linearGradient>
  </defs>

  <!-- Luxury Monogram Emblem / Aperture Shutter Icon -->
  <g transform="translate(6, 8)">
    <!-- Outer Shield / Diamond Frame -->
    <rect x="2" y="2" width="70" height="70" rx="10" fill="#262626" stroke="url(#goldGrad)" stroke-width="2" />
    
    <!-- Camera Aperture Blades -->
    <circle cx="37" cy="37" r="22" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4, 3" />
    <circle cx="37" cy="37" r="14" fill="none" stroke="#FFFFFF" stroke-width="1.2" opacity="0.9" />
    <circle cx="37" cy="37" r="6" fill="url(#goldGrad)" />
    
    <!-- Est Text -->
    <text x="37" y="64" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="6.5" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1.5">EST. KATNI</text>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(92, 16)">
    <!-- Main Studio Name -->
    <text x="0" y="30" font-family="'Cormorant Garamond', Georgia, serif" font-size="26" font-weight="700" fill="#FDFBF7" letter-spacing="3">
      THE KATNI CREATION
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="1" y="50" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="8" font-weight="600" fill="#A8A29E" letter-spacing="2.5">
      CINEMATIC WEDDINGS &bull; MONOGRAPHS
    </text>
  </g>
</svg>
